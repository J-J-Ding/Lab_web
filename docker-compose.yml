name: lab-web

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backend:
    image: lab-web-backend:v19-20261108-01
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "2", "--timeout", "30", "--access-logfile", "-", "--access-logformat", "request_id=%({x-request-id}o)s method=%(m)s status=%(s)s duration=%(L)s", "--error-logfile", "-"]
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    environment: &backend_environment
      ACCOUNT_IMPORT_KEY: ${ACCOUNT_IMPORT_KEY:-}
      INITIAL_ACCOUNT_PASSWORD: ${INITIAL_ACCOUNT_PASSWORD:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-False}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      AUTH_LOGIN_ACCOUNT_IP_LIMIT: ${AUTH_LOGIN_ACCOUNT_IP_LIMIT:-10}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-60}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:-${POSTGRES_USER}}
      POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-${POSTGRES_PASSWORD}}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      FILE_SCAN_REQUIRED: ${FILE_SCAN_REQUIRED:-False}
      CLAMAV_SOCKET: ${CLAMAV_SOCKET:-}
      AI_ENABLED: ${AI_ENABLED:-False}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-5}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-0}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-24000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4000}
      AI_USER_DAILY_LIMIT: ${AI_USER_DAILY_LIMIT:-10}
      AI_GLOBAL_DAILY_LIMIT: ${AI_GLOBAL_DAILY_LIMIT:-100}
      AI_GLOBAL_DAILY_BUDGET_CNY: ${AI_GLOBAL_DAILY_BUDGET_CNY:-10}
      AI_PRICE_INPUT_CNY_PER_MILLION: ${AI_PRICE_INPUT_CNY_PER_MILLION:-}
      AI_PRICE_OUTPUT_CNY_PER_MILLION: ${AI_PRICE_OUTPUT_CNY_PER_MILLION:-}
      AI_PRICE_EFFECTIVE_DATE: ${AI_PRICE_EFFECTIVE_DATE:-}
      AI_SOURCE_RETENTION_DAYS: ${AI_SOURCE_RETENTION_DAYS:-7}
      AI_CANDIDATE_RETENTION_DAYS: ${AI_CANDIDATE_RETENTION_DAYS:-30}
      AI_LEASE_SECONDS: ${AI_LEASE_SECONDS:-240}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-False}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
    volumes:
      - private_media:/app/private_media
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - host_access
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=8).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  migrate:
    image: lab-web-backend:v19-20261108-01
    profiles: ["maintenance"]
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *backend_environment
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - private_media:/app/private_media
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  content-import-worker:
    image: lab-web-backend:v19-20261108-01
    command: ["python", "manage.py", "run_content_imports"]
    environment: *backend_environment
    volumes:
      - private_media:/app/private_media
    networks: [backend, host_access]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import time,os; assert time.time()-os.stat('/tmp/content-import-heartbeat').st_mtime < 300"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  account-import-worker:
    image: lab-web-backend:v19-20261108-01
    command: ["python", "manage.py", "run_account_imports"]
    environment: *backend_environment
    volumes:
      - private_media:/app/private_media
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import time; assert time.time()-__import__('os').stat('/tmp/account-import-heartbeat').st_mtime < 600"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: lab-web-backend:v19-20261108-01
    profiles: ["ai"]
    command: ["python", "manage.py", "run_ai_worker"]
    environment: *backend_environment
    volumes:
      - private_media:/app/private_media
    networks: [backend, host_access]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; os.kill(1, 0); assert time.time()-os.stat('/tmp/lab-ai-worker-heartbeat').st_mtime < 300"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  postgres_data:
  private_media:

networks:
  host_access:
    driver: bridge
  backend:
    internal: true
