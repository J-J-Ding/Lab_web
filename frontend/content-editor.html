<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容编辑 - 智能系统实验室</title><link rel="stylesheet" href="/css/style.css?v=14-20261107-04"><link rel="stylesheet" href="/css/workspace.css?v=14-20261107-04"><script defer src="/js/auth.js?v=14-20261107-04"></script><script defer src="/js/navbar-loader.js?v=14-20261107-04"></script><script defer src="/js/layout.js?v=12"></script><script defer src="/js/content-api.js?v=14-20261107-04"></script><script defer src="/js/v10.js?v=14-20261107-04"></script><link rel="stylesheet" href="/css/layout-v11.css?v=14-20261107-04"><script src="/js/site-api.js?v=14-20261107-04"></script></head><body data-v10-page="editor"><div id="navbar-container"></div><main class="work-main"><h1>内容编辑</h1><nav class="work-nav" aria-label="个人与协同功能"><a href="/profile.html">个人资料</a><a href="/workspace.html" data-team-only>团队内容</a><a href="/ai-import.html">AI 辅助填写</a><a href="/manage/index.html" data-manager-only hidden>团队管理</a><a href="/statistics.html">科研统计</a></nav><p id="business-status" role="status" aria-live="polite" class="v10-status">正在连接账号服务…</p><div id="business-content" hidden><p class="v10-caption">带 <span class="required">*</span> 的项目为必填。其他信息可逐步补充；保存后立即生效，无需提交审核。</p><form id="direct-content-form" class="v10-form work-card"><div class="form-row"><label>内容类型 <span class="required">*</span><select name="kind" id="content-kind"><option value="PAPER">论文</option><option value="PATENT">专利</option><option value="PROJECT">科研项目</option><option value="AWARD">竞赛与荣誉</option><option value="NEWS">团队新闻</option><option value="ACTIVITY">团队活动</option><option value="BLOG">技术文章/资源共享</option><option value="PUBLICATION">出版成果</option><option value="LAB_PAGE" data-manager-only>团队简介/联系我们</option></select></label><label>展示范围<select name="visibility_scope"><option value="PUBLIC">公开网站可见</option><option value="TEAM">仅 Teacher / Student 团队可见</option></select></label></div><label>标题 <span class="required">*</span><input name="title" maxlength="500" required><label>摘要 <span class="optional">选填</span><textarea name="summary" maxlength="10000"></textarea><div id="detail-fields"></div><fieldset id="author-fieldset"><legend>关联团队成员 · 选填</legend><p class="v10-caption">选择已注册的 Teacher/Student，以姓名显示。使用上移/下移设置顺序；不调整时保留原顺序，新成员按系统默认排序。</p><label for="member-search">搜索姓名 <span class="optional">选填</span></label><input id="member-search" type="search" maxlength="100" autocomplete="off"><label for="author-choice">团队成员</label><select id="author-choice"></select><button id="add-author" type="button" class="secondary">关联成员</button><div id="author-selected"></div><p id="legacy-author-note" class="v10-caption"></p></fieldset><fieldset><legend>附件与关联项目 · 选填</legend><label for="content-file">选择 PDF / DOCX / 图片</label><input id="content-file" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp"><button type="button" id="upload-content" class="secondary">上传文件</button><p id="content-file-status" role="status" class="v10-file-status"></p><div id="attachment-list"></div><label for="project-choice">关联科研项目</label><select id="project-choice" multiple size="4"></select></fieldset><label class="check" data-manager-only hidden><input name="featured" type="checkbox">设为首页精选</label><p class="v10-caption">选择“公开网站可见”后，保存的内容将同步展示到科研栏目、关联成员主页和首页；私有成员姓名仍受本人公开设置保护。</p><div class="form-actions"><button id="save-content" type="submit">保存并生效</button><a href="/workspace.html">返回内容列表</a><button id="content-history" type="button" class="secondary" hidden>修改记录与恢复</button></div></form><div id="history-list" class="v10-list"></div><section id="grant-section" class="work-card" data-manager-only hidden><h2>内容协作权限</h2><p class="v10-caption">作者关联与编辑权限独立，只有 Teacher/Root 可以授权。</p><form id="grant-form" class="v10-form"><label>可编辑的团队成员<select name="user_id" id="grant-user"></select></label><label class="check"><input name="revoke" type="checkbox">撤销该成员的编辑权</label><button type="submit">保存协作权限</button></form></section></div></main></body></html>
