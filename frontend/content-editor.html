<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>内容编辑与版本审核 - 智能系统实验室</title>
<link rel="stylesheet" href="css/style.css?v=5-20261106">
<link rel="stylesheet" href="css/workspace.css?v=5-20261106">
<script defer src="js/auth.js?v=5-20261106">
</script>
<script defer src="js/navbar-loader.js?v=5-20261106">
</script>
<script defer src="js/content-api.js?v=5-20261106">
</script>
<script defer src="js/content-editor.js?v=5-20261106">
</script>
</head>
<body data-workspace-page="content-editor" data-management="false">
<div id="navbar-container">
</div>
<main class="work-main">
<h1>内容编辑与版本审核</h1>
<nav class="work-nav" aria-label="协同平台">
<a href="profile.html">个人中心</a>
<a href="workspace.html">我的工作区</a>
<a href="member-application.html">成员资料与身份申请</a>
<a href="manage/index.html" data-manager-only hidden>团队管理</a>
</nav>
<p id="business-status" class="work-message" role="status" aria-live="polite">正在验证登录状态…</p>
<div id="business-content" hidden>
<section class="work-card">
<p id="item-state" class="work-note">
</p>
<form id="content-form" hidden>
<label for="kind">内容类型</label>
<select id="kind" name="kind">
<option value="BLOG">技术博客</option>
<option value="PAPER">论文</option>
<option value="PROJECT">科研项目</option>
<option value="AWARD">竞赛与荣誉</option>
<option value="ACTIVITY">活动</option>
<option value="NEWS">新闻</option>
<option value="PUBLICATION">出版刊物</option>
<option value="LAB_PAGE">实验室介绍</option>
</select>
<label for="title">标题</label>
<input id="title" name="title" required maxlength="500">
<label for="summary">摘要</label>
<textarea id="summary" name="summary" maxlength="10000">
</textarea>
<div id="type-fields">
</div>
<fieldset id="contributor-box">
<legend>关联贡献者</legend>
<label for="contributor-choice">选择成员或外部合作者</label>
<select id="contributor-choice">
</select>
<button type="button" id="add-contributor">添加贡献者</button>
<div id="contribution-list">
</div>
<p class="work-note">暂无合作者时，可在下方建立外部署名；不会自动绑定网站账号。</p>
</fieldset>
<label for="project-links">关联项目（可多选）</label>
<select id="project-links" name="project_links" multiple size="4">
</select>
<div class="work-actions">
<button type="submit" id="save-content">保存草稿</button>
<button type="button" id="submit-content">提交审核</button>
<button type="button" id="withdraw-content" class="secondary">撤回投稿</button>
<button type="button" id="discard-content" class="secondary">放弃草稿</button>
<button type="button" id="clone-content">创建新版本</button>
</div>
</form>
</section>
<section class="work-card" id="external-card">
<h2>新增外部合作者</h2>
<form id="external-form">
<label for="external-name">署名</label>
<input id="external-name" name="display_name" required maxlength="150">
<label for="external-affiliation">单位</label>
<input id="external-affiliation" name="external_affiliation" maxlength="300">
<button>保存外部署名</button>
</form>
</section>
<section class="work-card" id="review-card" data-manager-only hidden>
<h2>审核此版本</h2>
<p id="review-eligibility" class="work-note">
</p>
<label for="review-reason">审核意见或核验理由</label>
<textarea id="review-reason" maxlength="2000">
</textarea>
<button id="approve-content" type="button" disabled>审核通过</button>
<button id="reject-content" type="button" disabled class="danger">驳回修改</button>
<div id="proxy-confirmations">
</div>
</section>
<section class="work-card">
<h2>版本对照</h2>
<div class="work-grid">
<div>
<h3>当前已发布版本</h3>
<div id="published-preview">
</div>
</div>
<div>
<h3>当前工作版本</h3>
<div id="working-preview">
</div>
</div>
</div>
<h3>历史版本与审核意见</h3>
<div id="history-list"></div>
<h3>管理操作记录</h3>
<div id="moderation-history"></div>
</section>
<section class="work-card" id="grant-card">
<h2>协作授权</h2>
<p class="work-note">请输入对方的账号 ID。授予内容编辑权不会改变业务角色。</p>
<form id="grant-form">
<label for="grant-user">协作者账号 ID</label>
<input id="grant-user" name="user_id" type="number" min="1" required>
<label>
<input id="grant-edit" type="checkbox" checked>允许编辑</label>
<label>
<input id="grant-revoke" type="checkbox">撤销授权</label>
<button>更新协作授权</button>
</form>
<div id="grant-list">
</div>
</section>
</div>
</main>
</body>
</html>
