<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成员资料与身份申请 - 智能系统实验室</title>
<link rel="stylesheet" href="css/style.css?v=5-20261106">
<link rel="stylesheet" href="css/workspace.css?v=5-20261106">
<script defer src="js/auth.js?v=5-20261106">
</script>
<script defer src="js/navbar-loader.js?v=5-20261106">
</script>
<script defer src="js/content-api.js?v=5-20261106">
</script>
<script defer src="js/member-profile.js?v=5-20261106">
</script>
</head>
<body data-workspace-page="member-application" data-management="false">
<div id="navbar-container">
</div>
<main class="work-main">
<h1>成员资料与身份申请</h1>
<nav class="work-nav" aria-label="协同平台">
<a href="profile.html">个人中心</a>
<a href="workspace.html">我的工作区</a>
<a href="member-application.html">成员资料与身份申请</a>
<a href="manage/index.html" data-manager-only hidden>团队管理</a>
</nav>
<p id="business-status" class="work-message" role="status" aria-live="polite">正在验证登录状态…</p>
<div id="business-content" hidden>
<section class="work-card">
<h2>成员资料草稿</h2>
<p class="work-note">账号信息与公开成员资料分别管理。这里的保存不会直接公开，也不会改变账号权限。</p>
<button id="initialize-profile" type="button" disabled>建立或重建资料草稿</button>
<p id="member-state">
</p>
<form id="member-form" hidden>
<label for="display-name">展示姓名</label>
<input id="display-name" name="display_name" required maxlength="150">
<label for="member-slug">个人主页标识</label>
<input id="member-slug" name="slug" required maxlength="160">
<label for="member-bio">个人简介</label>
<textarea id="member-bio" name="bio" maxlength="10000">
</textarea>
<label for="public-email">公开联系邮箱（独立选择）</label>
<input id="public-email" name="public_contact_email" type="email">
<label>
<input id="contact-enabled" name="public_contact_enabled" type="checkbox">允许在审核后展示此邮箱</label>
<label for="research-areas">研究方向（逗号分隔）</label>
<input id="research-areas" name="research_areas">
<fieldset>
<legend>教育经历</legend>
<div id="education-list">
</div>
<button type="button" id="add-education">新增教育经历</button>
</fieldset>
<fieldset>
<legend>毕业去向（可选）</legend>
<label>
<input id="has-alumni" type="checkbox">填写毕业去向</label>
<div class="work-grid">
<div>
<label for="graduation-year">毕业年份</label>
<input id="graduation-year" type="number" min="1900" max="2200">
</div>
<div>
<label for="alumni-degree">学位</label>
<input id="alumni-degree" maxlength="100">
</div>
</div>
<label for="destination-type">去向类别</label>
<select id="destination-type">
<option value="WORK">就业</option>
<option value="STUDY">升学</option>
<option value="OTHER">其他</option>
</select>
<label for="organization">单位</label>
<input id="organization" maxlength="200">
<label>
<input id="alumni-public" type="checkbox">审核后可公开此去向</label>
</fieldset>
<button id="save-member">保存成员草稿</button>
</form>
<form id="avatar-form">
<label for="avatar-file">头像（JPEG / PNG / WebP，最多 5 MiB）</label>
<input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp" required>
<button>上传头像</button>
</form>
<p id="avatar-result">
</p>
<form id="publish-member-form">
<h3>公开资料授权与提交</h3>
<label>
<input name="public_visible" type="checkbox">审核后公开成员主页</label>
<label>
<input name="contact_visible" type="checkbox">审核后公开已选择的联系邮箱</label>
<label>
<input name="education_visible" type="checkbox">审核后公开已选择的教育经历</label>
<label>
<input name="alumni_visible" type="checkbox">审核后公开已选择的毕业去向</label>
<button id="submit-member">提交资料审核</button>
<button id="withdraw-member" type="button" class="secondary">撤回资料审核</button>
</form>
</section>
<section class="work-card">
<h2>申请或认领正式成员身份</h2>
<p class="work-note">教师身份审核不会自动授予网站管理权限。已有成员档案的认领由管理者核验，不能凭同名自动绑定。</p>
<form id="application-form">
<label for="application-kind">申请身份</label>
<select id="application-kind" name="application_kind">
<option value="STUDENT">学生</option>
<option value="TEACHER">教师</option>
</select>
<label for="claim-profile">认领已有档案标识（没有则留空）</label>
<input id="claim-profile" name="target_profile">
<label for="application-statement">申请说明</label>
<textarea id="application-statement" name="statement" required maxlength="2000">
</textarea>
<label for="proof-file">证明材料 PDF（可选，最多 10 MiB；仅审核者可读）</label>
<input id="proof-file" type="file" accept="application/pdf">
<button>提交身份申请</button>
</form>
<div id="application-list">
</div>
</section>
<section class="work-card">
<h2>即时收紧隐私</h2>
<p class="work-note">收紧立即生效；重新公开必须提交新的授权并经他人审核。</p>
<div id="privacy-buttons">
</div>
</section>
</div>
</main>
</body>
</html>
