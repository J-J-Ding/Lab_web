<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人资料 - 智能系统实验室</title><link rel="stylesheet" href="/css/style.css?v=10"><link rel="stylesheet" href="/css/workspace.css?v=10"><script defer src="/js/auth.js?v=10"></script><script defer src="/js/navbar-loader.js?v=10"></script><script defer src="/js/layout.js?v=10"></script><script defer src="/js/content-api.js?v=10"></script><script defer src="/js/v10.js?v=10"></script></head><body data-v10-page="profile"><div id="navbar-container"></div><main class="work-main"><h1>个人资料</h1><nav class="work-nav" aria-label="个人与协同功能"><a href="/profile.html">个人资料</a><a href="/workspace.html" data-team-only>团队内容</a><a href="/resume.html">我的简历</a><a href="/ai-import.html">AI 辅助填写</a><a href="/manage/index.html" data-manager-only hidden>团队管理</a><a href="/statistics.html">科研统计</a></nav><p id="business-status" role="status" aria-live="polite" class="v10-status">正在连接账号服务…</p><div id="business-content" hidden><p id="identity-summary" class="v10-caption"></p><div class="v10-grid"><aside class="v10-sidebar"><a href="#basic">基本资料</a><a href="#education">教育经历</a><a href="#privacy">公开范围</a><a href="/workspace.html?mine=1" data-team-only>我的科研成果</a><a href="#security">账号与密码</a></aside><div><section class="work-card"><h2 id="basic">基本资料</h2><p class="v10-caption">资料可以逐步完善，选填为空不影响保存。姓名用于科研成果关联与个人主页，登录名不会作为作者姓名展示。</p><form id="business-profile-form" class="v10-form"><div id="profile-fields"></div><fieldset id="education"><legend>教育经历</legend><div id="education-rows"></div><button type="button" id="add-education" class="secondary">添加教育经历</button></fieldset><fieldset id="privacy"><legend>公开范围</legend><div id="privacy-fields"></div><p class="v10-caption" id="privacy-note"></p></fieldset><div class="form-actions"><button type="submit">保存资料</button><button type="button" id="profile-history" class="secondary">修改记录</button></div></form><div id="history-list" class="v10-list"></div></section><section id="security" class="work-card"><h2>账号安全</h2><p class="v10-caption">仅本人或 Root 可以管理账号安全信息。</p><form id="account-email-form" class="v10-form"><label for="account-email">登录联系邮箱 <span class="optional">选填</span></label><input id="account-email" name="email" type="email" maxlength="254"><div class="form-actions"><button type="submit">保存联系邮箱</button></div></form><form id="password-form" class="v10-form"><label for="old-password">当前密码 <span class="required">*</span></label><input id="old-password" name="old_password" type="password" autocomplete="current-password" required><label for="new-password">新密码 <span class="required">*</span></label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm-password">确认新密码 <span class="required">*</span></label><input id="confirm-password" name="confirm_new_password" type="password" autocomplete="new-password" minlength="8" required><div class="form-actions"><button type="submit">修改密码</button></div><p id="password-status" role="status"></p></form></section></div></div></div></main></body></html>
