<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人资料 - 智能系统实验室</title><link rel="stylesheet" href="/css/style.css?v=14-20261107-04"><link rel="stylesheet" href="/css/workspace.css?v=14-20261107-04"><script defer src="/js/auth.js?v=14-20261107-04"></script><script defer src="/js/navbar-loader.js?v=14-20261107-04"></script><script defer src="/js/layout.js?v=12"></script><script defer src="/js/content-api.js?v=14-20261107-04"></script><script defer src="/js/v10.js?v=14-20261107-04"></script><link rel="stylesheet" href="/css/layout-v11.css?v=14-20261107-04"><script src="/js/site-api.js?v=14-20261107-04"></script></head><body data-v10-page="profile"><div id="navbar-container"></div><main class="work-main"><h1>个人资料</h1><nav class="work-nav" aria-label="个人与协同功能"><a href="/profile.html">个人资料</a><a href="/workspace.html" data-team-only>团队内容</a><a href="/ai-import.html">AI 辅助填写</a><a href="/manage/index.html" data-manager-only hidden>团队管理</a><a href="/statistics.html">科研统计</a></nav><p id="business-status" role="status" aria-live="polite" class="v10-status">正在连接账号服务…</p><div id="business-content" hidden><p id="identity-summary" class="v10-caption"></p><div class="v10-grid"><aside class="v10-sidebar" aria-label="资料分区"><a href="#basic">基本资料</a><a href="#education">教育经历</a><a href="#profile-research">研究方向</a><a href="#alumni-fields">毕业去向</a><a href="#security">账号安全</a><a href="#resume-section">简历上传</a></aside><div id="profile-content-column"><form id="business-profile-form" class="v10-form"><section id="basic" class="profile-section"><h2>基本资料</h2><p class="v10-caption">星号标记为必填项。姓名用于个人主页和成果关联。</p><div id="profile-fields" class="profile-fields-grid"></div></section><section id="education" class="profile-section"><h2>教育经历</h2><div id="education-rows"></div><button type="button" id="add-education" class="secondary">添加教育经历</button></section><section id="profile-research" class="profile-section"><h2>研究方向</h2><div id="research-fields"></div></section><section id="alumni-fields" class="profile-section"></section><div class="form-actions"><button type="submit">保存资料</button><button type="button" id="profile-history" class="secondary">修改记录</button></div></form><div id="history-list" class="v10-list"></div><section id="security" class="profile-section work-card"><h2>账号安全</h2><p class="v10-caption">仅本人或 Root 可以管理账号安全信息。</p><form id="password-form" class="v10-form"><label for="old-password">当前密码 <span class="required">*</span></label><input id="old-password" name="old_password" type="password" autocomplete="current-password" required><label for="new-password">新密码 <span class="required">*</span></label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="6" maxlength="128" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,128}" title="至少6位，仅英文字母和数字，且两者都包含" required><label for="confirm-password">确认新密码 <span class="required">*</span></label><input id="confirm-password" name="confirm_new_password" type="password" autocomplete="new-password" minlength="6" maxlength="128" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,128}" title="至少6位，仅英文字母和数字，且两者都包含" required><div class="form-actions"><button type="submit">修改密码</button></div><p id="password-status" role="status"></p></form></section><section id="resume-section" class="profile-section work-card"><h2>简历上传</h2><p class="v10-caption">上传简历后，可以预览并提交给团队老师。</p><div id="resume-list" class="v10-list"></div><form id="resume-form" class="v10-form"><h3>编辑简历</h3>
<label for="resume-title">简历标题 <span class="required">*</span></label><input id="resume-title" name="title" maxlength="200" value="我的简历" required>

<label for="resume-introduction">个人介绍</label><textarea id="resume-introduction" name="introduction" maxlength="10000"></textarea>
<label for="resume-file">简历文件 <span class="optional">PDF/DOCX，投递前必需</span></label><input id="resume-file" type="file" accept=".pdf,.docx"><button type="button" id="upload-resume" class="secondary">上传简历文件</button>
<p id="resume-file-status" role="status" class="v10-file-status">请上传文件后保存，上传成功不代表已投递。</p>
<div class="form-actions"><button type="submit" id="resume-primary" hidden>保存并预览投递</button><button type="submit" class="secondary">保存简历</button><button id="resume-new" type="button" class="secondary">新建一份简历</button></div><p class="v10-caption">“保存简历”仅保存；访客需预览并确认共享后才会投递。</p>
<p id="resume-status" class="v10-status" role="status" aria-live="polite"></p>
</form><div id="resume-preview"></div></section></div></div></div></main></body></html>
