<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人资料 - 智能系统实验室</title><link rel="stylesheet" href="/css/style.css?v=10"><link rel="stylesheet" href="/css/workspace.css?v=10"><script defer src="/js/auth.js?v=12"></script><script defer src="/js/navbar-loader.js?v=12"></script><script defer src="/js/layout.js?v=12"></script><script defer src="/js/content-api.js?v=12"></script><script defer src="/js/v10.js?v=12"></script><link rel="stylesheet" href="/css/layout-v11.css?v=11"></head><body data-v10-page="profile"><div id="navbar-container"></div><main class="work-main"><h1>个人资料</h1><nav class="work-nav" aria-label="个人与协同功能"><a href="/profile.html">个人资料</a><a href="/workspace.html" data-team-only>团队内容</a><a href="/ai-import.html">AI 辅助填写</a><a href="/manage/index.html" data-manager-only hidden>团队管理</a><a href="/statistics.html">科研统计</a></nav><p id="business-status" role="status" aria-live="polite" class="v10-status">正在连接账号服务…</p><div id="business-content" hidden><p id="identity-summary" class="v10-caption"></p><div class="v10-grid"><aside class="v10-sidebar" aria-label="资料分区"><a href="#basic">基本资料</a><a href="#education">教育经历</a><a href="#profile-research">研究方向</a><a href="#alumni-fields">毕业去向</a><a href="#privacy">公开范围</a><a href="#security">账号安全</a><a href="#resume-section">简历上传</a></aside><div><form id="business-profile-form" class="v10-form"><section id="basic" class="profile-section"><h2>基本资料</h2><p class="v10-caption">资料可以逐步完善，选填为空不影响保存。姓名用于个人主页和成果关联。</p><div id="profile-fields" class="profile-fields-grid"></div></section><section id="education" class="profile-section"><h2>教育经历</h2><div id="education-rows"></div><button type="button" id="add-education" class="secondary">添加教育经历</button></section><section id="profile-research" class="profile-section"><h2>研究方向</h2><div id="research-fields"></div></section><section id="alumni-fields" class="profile-section"></section><section id="privacy" class="profile-section"><h2>公开范围</h2><div id="privacy-fields"></div><p id="privacy-note" class="v10-caption"></p></section><div class="form-actions"><button type="submit">保存资料</button><button type="button" id="profile-history" class="secondary">修改记录</button></div></form><div id="history-list" class="v10-list"></div><section id="security" class="profile-section work-card"><h2>账号安全</h2><p class="v10-caption">仅本人或 Root 可以管理账号安全信息。</p><form id="account-email-form" class="v10-form"><label for="account-email">登录联系邮箱 <span class="optional">选填</span></label><input id="account-email" name="email" type="email" maxlength="254"><div class="form-actions"><button type="submit">保存联系邮箱</button></div></form><form id="password-form" class="v10-form"><label for="old-password">当前密码 <span class="required">*</span></label><input id="old-password" name="old_password" type="password" autocomplete="current-password" required><label for="new-password">新密码 <span class="required">*</span></label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="6" maxlength="128" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,128}" title="至少6位，仅英文字母和数字，且两者都包含" required><label for="confirm-password">确认新密码 <span class="required">*</span></label><input id="confirm-password" name="confirm_new_password" type="password" autocomplete="new-password" minlength="6" maxlength="128" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,128}" title="至少6位，仅英文字母和数字，且两者都包含" required><div class="form-actions"><button type="submit">修改密码</button></div><p id="password-status" role="status"></p></form></section></div></div><section id="resume-section" class="profile-section work-card"><h2>简历上传</h2><p class="v10-caption">简历文件默认私有。访客可以确认共享范围后投递给团队老师。</p><div id="resume-list" class="v10-list"></div><form id="resume-form" class="v10-form work-card"><h2>编辑简历</h2><label>简历标题 <span class="required">*</span><input name="title" maxlength="200" value="我的简历" required><label>求职意向 <span class="optional">选填</span><input name="intention" maxlength="300"><label>个人介绍 <span class="optional">选填</span><textarea name="introduction" maxlength="10000"></textarea><label>简历文件 <span class="optional">选填，PDF/DOCX</span><input id="resume-file" type="file" accept=".pdf,.docx"><button type="button" id="upload-resume" class="secondary">上传简历文件</button><p id="resume-file-status" role="status" class="v10-file-status"></p><div class="form-actions"><button type="submit">保存简历</button><button id="resume-new" type="button" class="secondary">新建一份简历</button></div></form></section></div></main></body></html>
