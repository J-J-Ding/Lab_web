<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel批量创建账号</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/workspace.css"><link rel="stylesheet" href="/css/layout-v11.css"><script defer src="/js/auth.js"></script><script defer src="/js/navbar-loader.js"></script><script defer src="/js/layout.js?v=18"></script><script defer src="/js/content-api.js"></script><script defer src="/js/account-import.js?v=18"></script><style>.import-scroll{max-width:100%;overflow:auto}.import-table{width:100%;border-collapse:collapse;min-width:550px}.import-table th,.import-table td{padding:10px;border-bottom:1px solid #dce6f2;text-align:left}.import-table th{background:#f1f6fc}.import-state{padding:14px;background:#eef5ff;font-weight:bold}</style></head><body><div id="navbar-container"></div><main class="work-main"><h1>Excel批量创建账号</h1><a href="/manage/index.html">返回团队管理</a><p id="business-status" role="status"></p><div id="business-content" hidden><section class="work-card"><h2>1. 下载并填写模板</h2><p>仅支持xlsx，单文件不超过2 MiB，每批最多500个账号。用户名必须唯一，已注销账号的用户名也不能复用。初始密码留空使用系统默认值；姓名可留空。原始Excel含密码时请妥善保管。</p><a href="/api/admin/account-imports/template/">下载账号导入模板</a><p>身份：Teacher / student / custom；状态：正常 / 已注销。预览不会显示密码。整批校验通过后才允许创建，不更新已有账号。</p></section><form id="import-form" class="v10-form work-card"><h2>2. 上传并校验</h2><input type="file" name="file" accept=".xlsx" required aria-label="账号Excel文件"><button type="submit">上传并预览</button></form><section id="import-preview" class="work-card" hidden><h2>3. 核对并创建</h2><p id="import-state" class="import-state" role="status"></p><div id="import-errors"></div><div class="import-scroll"><table class="import-table"><thead><tr><th>Excel行</th><th>序号</th><th>用户名</th><th>身份</th><th>状态</th><th>姓名</th></tr></thead><tbody id="import-rows"></tbody></table></div><nav id="import-pages" class="work-nav"></nav><button id="confirm-import" type="button" hidden>确认创建整批账号</button><p>确认后由后台任务处理，请等待最终结果。重复确认不会重复创建；发生冲突则整批回滚。</p></section></div></main></body></html>
