<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页轮播管理</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/workspace.css"><link rel="stylesheet" href="/css/layout-v11.css"><script defer src="/js/auth.js"></script><script defer src="/js/navbar-loader.js"></script><script defer src="/js/layout.js?v=17"></script><script defer src="/js/content-api.js"></script><script defer src="/js/carousel-manager.js?v=18-import-20261108"></script><style>.slide-thumb{width:180px;max-height:120px;object-fit:contain}.slide-entry{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:15px 0;padding:15px;border:1px solid #dce6f2}.carousel-actions{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div id="navbar-container"></div><main class="work-main"><h1>首页轮播管理</h1><a href="/manage/index.html">返回团队管理</a><p id="business-status" role="status"></p><div id="business-content" hidden><form id="mode-form" class="v10-form work-card"><h2>首页图片来源</h2><p id="carousel-source" role="status" style="font-weight:bold;color:#205f9d"></p><label>展示模式<select name="mode"><option value="AUTO">自动：新闻／活动封面</option><option value="MANUAL">手动：首页轮播管理列表</option></select></label><p>手动模式只展示启用的轮播项；没有启用图片时显示实验室Logo占位图。启用图片将对外公开。</p><button>保存展示模式</button></form><section class="work-card"><h2>轮播图片</h2><div id="slide-list"></div><nav id="slide-pages" class="work-nav"></nav></section><form id="slide-form" class="v10-form work-card"><h2 id="slide-form-heading">新增轮播图片</h2><label>图片 *<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"></label><p>PNG / JPG / WebP，单张不超过5 MiB。选择图片后点击上传；编辑时不选文件可保留原图。</p><button type="button" id="upload-slide">上传图片</button><p id="upload-status" role="status"></p><img id="slide-preview" class="slide-thumb" alt="轮播图片预览" hidden><label>标题<input name="title" maxlength="200"></label><label>副标题<input name="subtitle" maxlength="500"></label><label>显示顺序<input name="position" type="number" min="1" max="10000" value="1" required></label><label><input name="enabled" type="checkbox" checked>启用，对外展示</label><div class="carousel-actions"><button id="save-slide">保存轮播项</button><button type="button" id="new-slide">新增一项</button></div></form></div></main></body></html>
