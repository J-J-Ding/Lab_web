<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成员申请与档案 - 智能系统实验室</title>
<link rel="stylesheet" href="../css/style.css?v=5-20261106">
<link rel="stylesheet" href="../css/workspace.css?v=5-20261106">
<script defer src="../js/auth.js?v=5-20261106">
</script>
<script defer src="../js/navbar-loader.js?v=5-20261106">
</script>
<script defer src="../js/content-api.js?v=5-20261106">
</script>
<script defer src="../js/management.js?v=5-20261106">
</script>
</head>
<body data-workspace-page="members" data-management="true">
<div id="navbar-container">
</div>
<main class="work-main">
<h1>成员申请与档案</h1>
<nav class="work-nav" aria-label="协同平台">
<a href="../profile.html">个人中心</a>
<a href="../workspace.html">我的工作区</a>
<a href="../member-application.html">成员资料与身份申请</a>
<a href="../manage/index.html" data-manager-only hidden>团队管理</a>
</nav>
<p id="business-status" class="work-message" role="status" aria-live="polite">正在验证登录状态…</p>
<div id="business-content" hidden>
<section class="work-card">
<h2>待审身份申请</h2>
<div id="member-application-tasks">
</div>
<div id="member-task-pages">
</div>
</section>
<section class="work-card">
<h2>规范成员档案</h2>
<form id="catalog-form">
<label for="catalog-name">成员姓名</label>
<input id="catalog-name" name="display_name" required maxlength="150">
<label for="catalog-kind">档案类型</label>
<select id="catalog-kind" name="member_kind">
<option value="STUDENT">学生</option>
<option value="TEACHER">教师</option>
</select>
<button>建立未绑定档案</button>
</form>
<div id="member-catalog">
</div>
<div id="catalog-pages">
</div>
<form id="bind-form">
<label for="bind-profile">未绑定档案 UUID</label>
<input id="bind-profile" name="profile_id" required>
<label for="bind-user">可管理账号 ID</label>
<input id="bind-user" name="user_id" type="number" min="1" required>
<button>绑定账号</button>
</form>
<p class="work-note">直接绑定不会授予新角色或自动发布；已有临时档案请走认领审批，不能覆盖。</p>
</section>
</div>
</main>
</body>
</html>
