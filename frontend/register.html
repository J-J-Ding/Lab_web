<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>注册账号 - 智能系统实验室</title>
  <link rel="stylesheet" href="css/style.css?v=14-20261107-04">
  <link rel="stylesheet" href="css/auth.css?v=3">
  <script defer src="js/auth.js?v=14-security-20261107"></script>
  <script defer src="js/navbar-loader.js?v=14-security-20261107"></script>
<link rel="stylesheet" href="/css/layout-v11.css?v=14-hero-fit-20261107"><script src="/js/site-api.js?v=14-20261107-04"></script></head>
<body data-auth-page="register">
  <div id="navbar-container"></div>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="page-title">
      <p class="auth-eyebrow">智能系统实验室 · 账号服务</p>
      <h1 id="page-title">注册账号</h1>
      <p class="auth-intro">新账号默认身份：CUSTOMER（访客）。注册成功后请登录。</p>
      <p id="auth-status" class="auth-message" role="status" aria-live="polite"></p>
      <button type="button" class="auth-button" data-auth-retry hidden>重试</button>
      <form id="register-form" class="auth-form" novalidate>
<div class="auth-field"><label for="username">用户名</label><input type="text" name="username" id="username" maxlength="150" required autocomplete="username" aria-describedby="username-help"><p class="auth-help" id="username-help">最多 150 个字符，可使用字母、数字及 @ . + - _。</p></div>
<div class="auth-field"><label for="password">密码</label><input type="password" name="password" id="password" maxlength="128" required autocomplete="new-password" minlength="6" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,128}" title="至少6位，仅英文字母和数字，且两者都包含" aria-describedby="password-help"><p class="auth-help" id="password-help">6至128位，仅包含英文字母和数字，且两者都包含。</p></div>
<div class="auth-field"><label for="confirm_password">确认密码</label><input type="password" name="confirm_password" id="confirm_password" maxlength="128" required autocomplete="new-password" minlength="6" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,128}" title="至少6位，仅英文字母和数字，且两者都包含"></div>
        <button type="submit" class="auth-button" disabled>注册账号</button>
      </form>
      <p id="register-status" class="auth-message" role="status" aria-live="polite"></p>
      <a href="login.html?registered=1" id="registered-login" class="auth-button" hidden>前往登录</a>
      <p class="auth-footer">已有账号？<a href="login.html">登录</a></p>
    </section>
  </main>
  <noscript><p class="auth-main">账号功能需要启用 JavaScript，官网栏目仍可通过浏览器访问。</p></noscript>
<script defer src="/js/layout.js?v=14-footer-20261107"></script></body>
</html>
